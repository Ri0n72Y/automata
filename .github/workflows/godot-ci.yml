name: Godot CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false

      - name: Show Godot version
        run: godot --version

      - name: Import project
        run: godot --headless --path . --editor --quit

      - name: Run runtime test matrix
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            res://tests/scene_01/scene_01_lifecycle_state_smoke_test.gd
            res://tests/scene_01/scene_01_lifecycle_smoke_test.gd
            res://tests/scene_01/scene_01_lifecycle_speed_collision_smoke_test.gd
            res://tests/scene_01/scene_01_lifecycle_run_preparation_contract_test.gd
            res://tests/scene_01/scene_01_lifecycle_move_preparation_contract_test.gd
            res://tests/scene_01/scene_01_lifecycle_boundary_regression_test.gd
            res://tests/input/vehicle_move_capability_contract_test.gd
            res://tests/scene_01/scene_01_vehicle_rebuild_smoke_test.gd
            res://tests/scene_01/scene_01_manual_test_layout_smoke_test.gd
            res://tests/input/vehicle_move_controller_contract_test.gd
            res://tests/input/vehicle_grab_drop_input_test.gd
            res://tests/scene_01/scene_01_grab_drop_smoke_test.gd
            res://tests/scene_01/scene_01_grab_drop_isolation_smoke_test.gd
            res://tests/scene_01/scene_01_camera_rotation_mapping_smoke_test.gd
            res://tests/assembly/assembly_compiler_contract_test.gd
            res://tests/assembly/program_capability_validator_contract_test.gd
            res://tests/scene_01/scene_01_assembly_definition_adapter_contract_test.gd
            res://tests/scene_01/scene_01_assembly_compile_gate_contract_test.gd
          )

          failed=0
          for test in "${tests[@]}"; do
            echo "=== RUN  $test ==="
            if godot --headless --path . --script "$test"; then
              echo "=== PASS $test ==="
            else
              rc=$?
              echo "=== FAIL $test (exit=$rc) ==="
              failed=1
            fi
          done

          exit "$failed"
