name: Godot CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false

      - name: Show Godot version
        run: godot --version

      - name: Import project
        run: godot --headless --path . --editor --quit

      - name: Run runtime test matrix
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(
            find tests -type f \
              \( -name '*_test.gd' -o -name '*_smoke_test.gd' \) \
              ! -path 'tests/fixtures/*' \
              ! -path 'tests/support/*' \
              -print | sort
          )

          failed=0
          for test_path in "${tests[@]}"; do
            test="res://$test_path"
            log="$(mktemp)"
            echo "=== RUN  $test ==="
            if godot --headless --path . --script "$test" 2>&1 | tee "$log"; then
              rc=0
            else
              rc=$?
            fi
            if (( rc != 0 )) || grep -q 'SCRIPT ERROR:' "$log"; then
              echo "=== FAIL $test (exit=$rc) ==="
              failed=1
            else
              echo "=== PASS $test ==="
            fi
            rm -f "$log"
          done

          exit "$failed"
