name: Godot CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      suite:
        description: Runtime suite to run manually
        required: true
        default: full
        type: choice
        options:
          - full
          - stability

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GODOT_FATAL_LOG_PATTERN: 'SCRIPT ERROR:|Parse Error:|CRC error|ERROR: (Error importing|Error loading image|Failed loading resource)|Shader compilation failed|ERROR:.*[Ss]hader|ObjectDB instances were leaked|resources still in use at exit'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Show Godot version
        run: godot --version

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT

          if godot --headless --path . --editor --quit 2>&1 | tee "$log"; then
            rc=0
          else
            rc=$?
          fi

          if (( rc != 0 )) || grep -Eq "$GODOT_FATAL_LOG_PATTERN" "$log"; then
            echo "Godot import failed (exit=$rc)."
            exit 1
          fi

      - name: Run runtime test matrix
        shell: bash
        env:
          REQUESTED_SUITE: ${{ inputs.suite || 'stability' }}
        run: |
          set -euo pipefail
          readonly test_timeout_seconds=30

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "full" ]]; then
            echo "Running manually requested Full Suite."
            mapfile -t tests < <(
              find tests -type f \
                \( -name '*_test.gd' -o -name '*_smoke_test.gd' \) \
                ! -path 'tests/fixtures/*' \
                ! -path 'tests/support/*' \
                -print | sort
            )
          else
            echo "Running dependency-risk stability suite."
            mapfile -t tests < <(
              find tests/stability -type f \
                \( -name '*_test.gd' -o -name '*_smoke_test.gd' \) \
                -print | sort
            )
          fi

          if (( ${#tests[@]} == 0 )); then
            echo "No tests discovered for selected suite."
            exit 1
          fi

          echo "Discovered ${#tests[@]} runtime tests."
          failed=0
          for test_path in "${tests[@]}"; do
            test="res://$test_path"
            log="$(mktemp)"
            echo "=== RUN  $test ==="
            if timeout --signal=TERM --kill-after=5s "${test_timeout_seconds}s" \
              godot --headless --path . --script "$test" 2>&1 | tee "$log"; then
              rc=0
            else
              rc=$?
            fi
            if (( rc != 0 )) || grep -Eq "$GODOT_FATAL_LOG_PATTERN" "$log"; then
              echo "=== FAIL $test (exit=$rc) ==="
              failed=1
            else
              echo "=== PASS $test ==="
            fi
            rm -f "$log"
          done

          exit "$failed"
